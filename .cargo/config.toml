# One shared target/ for the whole tree.
[build]
target-dir = "target"

# Bare targets default to `rust-lld`, so no linker needs naming here.
# The linker script is supplied by crates/mlos-kernel/build.rs, which
# resolves it to an absolute path -- a relative -T is resolved against the
# working directory, which is not stable across cargo invocations.

# The bare targets get the whole workspace MINUS the host-only crates --
# the ones that use `std` and so cannot link for a bare target at all.
# Not a bare `--target`, which would sweep those in and fail confusingly.
#
# The lists drifted once: kbuild-arm named every crate and kclippy-arm did
# not, so four crates were built for the bare targets and never linted
# there, and an unused import reached a commit through the gap. Excluding
# host-only crates instead of naming bare-target ones keeps the four
# aliases identical, which is what stops that recurring.
#
# The exclusions still have to be written out four times, so
# `crates/mlos-cli/tests/aliases.rs` checks that all four agree with each
# other AND that the set is exactly the crates without `#![no_std]`.
# Adding a host-side crate and forgetting this line fails `cargo test`
# with a message saying which line to edit.
#
# `--lib --bins`, not `--all-targets`: there is no test harness on a bare
# target, so `--all-targets` tries to build the test binaries and fails.
# Tests are a host-side concern and run under `cargo test`.
[alias]
kbuild-arm  = "build  --workspace --exclude mlos-cli --exclude mlos-elf --exclude mlos-image-map --exclude mlos-layout --target aarch64-unknown-none-softfloat"
kbuild-x86  = "build  --workspace --exclude mlos-cli --exclude mlos-elf --exclude mlos-image-map --exclude mlos-layout --target x86_64-unknown-none"
kclippy-arm = "clippy --workspace --exclude mlos-cli --exclude mlos-elf --exclude mlos-image-map --exclude mlos-layout --target aarch64-unknown-none-softfloat --lib --bins"
kclippy-x86 = "clippy --workspace --exclude mlos-cli --exclude mlos-elf --exclude mlos-image-map --exclude mlos-layout --target x86_64-unknown-none --lib --bins"
