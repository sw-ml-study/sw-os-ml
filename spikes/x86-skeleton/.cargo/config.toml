[build]
target = "x86_64-unknown-none"
# Its own target/, overriding the repo root's shared one (Cargo merges
# parent configs): scripts/boot-test.sh looks for the image here.
target-dir = "target"

# Static, not PIE: the 32-bit PVH entry uses absolute addresses before
# paging exists, and the image is loaded at a fixed physical address.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-Tlinker.ld"]
