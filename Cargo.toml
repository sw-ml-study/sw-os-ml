[workspace]
resolver = "3"
members = [
    "crates/mlos-abi",
    "crates/mlos-console",
    "crates/mlos-virtio",
    "crates/mlos-cli",
    "crates/mlsh",
    "crates/mlos-device",
    "crates/mlos-fdt",
    "crates/mlos-hal",
    "crates/mlos-gic-aarch64",
    "crates/mlos-hal-aarch64",
    "crates/mlos-machine",
    "crates/mlos-mmu-aarch64",
    "crates/mlos-pl011",
    "crates/mlos-trap-aarch64",
    "crates/mlos-kernel",
]

# Host-side commands (`cargo test`, `cargo clippy`) operate on these.
# `mlos-kernel` is excluded: it is `no_std`/`no_main` and cannot link for
# the host triple, so anything that sweeps it in on the host fails. It is
# built explicitly, with `-p` and a bare `--target` -- see the
# `kbuild-arm` / `kbuild-x86` aliases in .cargo/config.toml.
default-members = [
    "crates/mlos-abi",
    "crates/mlos-virtio",
    "crates/mlos-device",
    "crates/mlos-fdt",
    "crates/mlos-hal",
    "crates/mlos-machine",
    "crates/mlos-pl011",
    "crates/mlos-cli",
    "crates/mlos-queue",
    "crates/mlsh",
]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/sw-ml-study/sw-os-ml"
authors      = ["Software Wrighter LLC"]

[workspace.lints.rust]
missing_docs            = "warn"
unsafe_op_in_unsafe_fn  = "deny"
unused_must_use         = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto           = true
opt-level     = "s"
codegen-units = 1
debug         = true      # symbols for the gdb stub; stripped from the image
