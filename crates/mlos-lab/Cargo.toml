[package]
name        = "mlos-lab"
version     = "0.0.1"
description = "The one live object manager: statics, device discovery, and the verbs a shell drives."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
mlos-abi        = { path = "../mlos-abi",        version = "0.0.1" }
mlos-ladder  = { path = "../mlos-ladder",  version = "0.0.1" }
