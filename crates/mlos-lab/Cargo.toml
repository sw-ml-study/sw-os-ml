mlos-virtio     = { path = "../mlos-virtio",     version = "0.0.1" }
mlos-virtio-blk = { path = "../mlos-virtio-blk", version = "0.0.1" }

mlos-policy     = { path = "../mlos-policy",     version = "0.0.1" }
