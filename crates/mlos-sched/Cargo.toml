[package]
name        = "mlos-sched"
version     = "0.0.1"
description = "Whose turn it is: process-major and parameter-major scheduling over sessions' declared streams."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
# `merge` drives a schedule over per-session streams into one trace. It
# needs a growable buffer, which the kernel does not have; the simulator
# and the workloads turn it on.
alloc = []

[dependencies]
mlos-abi    = { path = "../mlos-abi",    version = "0.0.1" }
mlos-objtab = { path = "../mlos-objtab", version = "0.0.1" }
mlos-trace  = { path = "../mlos-trace",  version = "0.0.1" }

[lints]
workspace = true
