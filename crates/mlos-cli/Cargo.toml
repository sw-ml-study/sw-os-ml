[package]
name        = "mlos-cli"
version     = "0.0.1"
description = "Build, run and diagnose MLOS."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
mlos-image-map = { path = "../mlos-image-map", version = "0.0.1" }
mlos-layout    = { path = "../mlos-layout",    version = "0.0.1" }
mlos-synth     = { path = "../mlos-synth",     version = "0.0.1" }
mlos-workload  = { path = "../mlos-workload",  version = "0.0.1" }

[dev-dependencies]
mlos-admit    = { path = "../mlos-admit",    version = "0.0.1" }
mlos-lab      = { path = "../mlos-lab",      version = "0.0.1" }
mlos-ladder   = { path = "../mlos-ladder",   version = "0.0.1" }
mlos-objman   = { path = "../mlos-objman",   version = "0.0.1" }
mlos-session  = { path = "../mlos-session",  version = "0.0.1" }
mlos-policy   = { path = "../mlos-policy",   version = "0.0.1" }
mlos-sim      = { path = "../mlos-sim",      version = "0.0.1" }
mlos-objtab   = { path = "../mlos-objtab",   version = "0.0.1" }
mlos-sched    = { path = "../mlos-sched",    version = "0.0.1", features = ["alloc"] }
mlos-trace    = { path = "../mlos-trace",    version = "0.0.1" }

[[bin]]
name = "mlos"
path = "src/main.rs"

[lints]
workspace = true
